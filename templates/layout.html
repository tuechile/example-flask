<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pirenily {% block title %}{% endblock %}</title>
    <meta property="og:title" content="Pirenily {{ self.title() }}">
    {% include "partials/meta.html" %}
    <!-- Import necessary fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=Libre+Caslon+Display&display=swap"
        rel="stylesheet">
    <link href="/static/favicon.ico" rel="icon">
    <link href="/static/css/styles.css?v={{ asset_v }}" rel="stylesheet">
    {% block extra_css %}
    {% endblock %}
</head>

<body>
    <!-- Loader -->
    <div class="loader-container hidden">
        <img src="{{ img('other', 'loader.gif') }}" alt="Loading...">
    </div>

    <!-- Main Content -->
    <main>
        <nav class="navigator">
            <div class="nav-header">
                <a class="nav-header" href="/"> Pirenily </a>
            </div>
            <button class="nav-toggle" type="button" aria-label="Open menu" aria-expanded="false"><span></span><span></span></button>
            <div class="nav-item-big">
                <a class="nav-item" href="/about"{% if nav_section == "about" %} aria-current="page"{% endif %}> About </a>
                <a class="nav-item" href="/design"{% if nav_section == "design" %} aria-current="page"{% endif %}> Design </a>
                <a class="nav-item" href="/play"{% if nav_section == "play" %} aria-current="page"{% endif %}> Play </a>
                <a class="nav-item" href="/#portfolio"{% if nav_section == "projects" %} aria-current="page"{% endif %}> Projects </a>
            </div>
        </nav>
        {% block content %}
        {% endblock %}
    </main>
    <footer>
        {% block footer %}
        {% endblock %}
        <p></p>
        Chi (Tue) Le | pirenily | Updated {{ last_updated }}
    </footer>

    <script src="{{ url_for('static', filename='loading.js') }}?v={{ asset_v }}">
    </script>
    <script src="{{ url_for('static', filename='nav.js') }}?v={{ asset_v }}"></script>
    <script src="{{ url_for('static', filename='fire.js') }}?v={{ asset_v }}"></script>
</body>

</html>
